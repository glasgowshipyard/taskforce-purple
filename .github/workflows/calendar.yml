name: Filing calendar

# The one daily check (REBUILD_SPEC §8, #54). Campaign money only changes
# when committees file, so this does almost nothing most days: one FEC
# request for the reporting dates and one fetch of the public roster.
#   - A filing deadline members file for passed a few days ago and hasn't
#     been refreshed for: start the refresh (grades from the bulk files,
#     then the record-by-record check).
#   - The roster changed (a new member, a departure, a party or seat
#     change): update the site's list and the identity crosswalk, and grade
#     any new member (#53).
#   - The FEC's outside-spending file changed since the site was built:
#     rebuild the site, so the figures keep up while groups file daily
#     (until 3 December 2026, then it stops itself: outside-check.mjs).
#   - Then turn /api/health into an alert if anything is wrong.
# The daily schedule is the one clock (owner's yes, 2026-10-18); it can also
# be started by hand.
on:
  schedule:
    - cron: '0 16 * * *' # 9 am Pacific (8 am in winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check and report, start and write nothing'
        type: boolean
        default: true

permissions:
  contents: write # the crosswalk, when the roster's FEC IDs change
  issues: write
  actions: write # to start the refresh

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Check the filing calendar
        id: calendar
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/refresh/calendar.mjs "${args[@]}"

      - name: Check the roster
        id: roster
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/refresh/roster.mjs "${args[@]}"

      - name: Check outside spending
        id: outside
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/site/outside-check.mjs "${args[@]}"

      - name: Save the crosswalk
        if: steps.roster.outputs.crosswalk == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/fec-crosswalk.js
          git commit -m 'Roster update: regenerate the FEC crosswalk (#53)'
          git push

      # Seats, parties and names are on the pre-built pages too (the refresh
      # rebuilds them only when grades change), and so is outside spending
      - name: Rebuild the site's pages
        if: steps.roster.outputs.changed != '' || steps.roster.outputs.removed != '' || steps.outside.outputs.due == 'true'
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::PAGES_DEPLOY_HOOK is not set: the pre-built pages keep the old roster until the next build"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Site rebuild started"

      - name: Grade new members
        if: steps.roster.outputs.added != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run refresh.yml -f members="${{ steps.roster.outputs.added }}" -f grade_only=true -f dry_run=false

      - name: Start the refresh after a filing deadline
        if: steps.calendar.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.calendar.outputs.reason }}
        run: |
          # Grades from the bulk files first (minutes), then the check
          # (hours, its own lane): grade first, confirm after
          gh workflow run refresh.yml -f grade_only=true -f dry_run=false
          gh workflow run refresh.yml -f dry_run=false -f new_round="$REASON"

      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_FAILED_URL: ${{ job.status != 'success' && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          OUTSIDE_STALE: ${{ steps.outside.outputs.stale }}
        run: bash scripts/health-alert.sh
