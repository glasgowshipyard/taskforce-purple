name: Refresh

# The refresh job (REBUILD_SPEC.md §5): all FEC work, off Cloudflare.
# Stage 2: started by hand, and it records results without publishing them.
# A pass that outlasts one run (the FEC allows 1,000 calls an hour) starts its
# own next run until every member is done. The filing-calendar trigger (§8)
# comes in Stage 3; every scheduled job is paused for the rebuild (owner's
# decision, 2026-10-03).
on:
  workflow_dispatch:
    inputs:
      members:
        description: 'Bioguide IDs, comma-separated (empty = every member)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: compute and report, write nothing'
        type: boolean
        default: true
      new_round:
        description: 'Start a new round, with this reason (empty = continue the open round)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: write # to start the next run of a pass

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: |
          npm ci
          npm install --no-save @duckdb/node-api

      - name: Run the refresh job
        id: refresh
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MEMBERS: ${{ inputs.members }}
          DRY_RUN: ${{ inputs.dry_run }}
          NEW_ROUND: ${{ inputs.new_round }}
        run: |
          # Stop cleanly before the job's 350-minute limit; the next run of the
          # round continues where this one stopped
          args=(--bulk-dir "$RUNNER_TEMP/bulk" --trigger manual --budget-minutes 320)
          if [ -n "$NEW_ROUND" ]; then args+=(--new-round "$NEW_ROUND"); fi
          if [ -n "$MEMBERS" ]; then args+=(--members "$MEMBERS"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/refresh/run.mjs "${args[@]}"

      # Opens, updates or closes the system-alert issue from /api/health
      # (failing members, unreconciled committees, D1 budget) plus this job's
      # own failure, each with a proposed fix (REBUILD_SPEC §5 step 9)
      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_FAILED_URL: ${{ job.status != 'success' && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || '' }}
        run: bash scripts/health-alert.sh

      # A pass over Congress takes several runs. When this run stopped on its
      # time budget with members left, and finished at least one (so it can't
      # loop on members that keep failing), start the next run of the same
      # round. A stop for the D1 budget doesn't chain: D1 resets at 00:00 UTC.
      - name: Continue the pass
        if: always() && steps.refresh.outputs.stop_reason == 'time' && steps.refresh.outputs.progressed != '0' && !inputs.dry_run && inputs.members == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "${{ steps.refresh.outputs.remaining }} member(s) left: starting the next run of this pass"
          gh workflow run refresh.yml -f dry_run=false
