name: Races

# The 2026 races (ROADMAP Phase E): grade everyone on November's ballot for
# Congress and publish the races for the site's Races tab.
#
# Who's on the ballot comes from Wikipedia's lists matched to the FEC, checked
# against the FEC's pre-general reports (due 22 October 2026; races.mjs), so
# this runs on the filing calendar: the morning after the deadline (23 Oct)
# and again on 27 Oct for filings the FEC processed late.
# It switches itself off after the second run, so no clock is left running
# (CLAUDE.md). Started by hand at any other time.
on:
  schedule:
    - cron: '0 15 23,27 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: grade and report, publish nothing'
        type: boolean
        default: false
      states:
        description: 'Only these states, comma-separated (empty = all)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: races
  cancel-in-progress: false

jobs:
  races:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci # includes DuckDB (devDependencies, pinned)

      - name: Grade and publish the races
        id: races
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATES: ${{ inputs.states }}
          # 30 FEC calls a minute, beside the record check's 86 (the key allows
          # 120 a minute since 2026-10-07)
          FEC_MIN_INTERVAL_MS: '2000'
        run: |
          args=(--bulk-dir "$RUNNER_TEMP/bulk")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run --out "$RUNNER_TEMP/races-dry-run.json"); fi
          if [ -n "$STATES" ]; then args+=(--states "$STATES"); fi
          node scripts/refresh/races.mjs "${args[@]}"

      - name: Keep the dry run's races
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: races-dry-run
          path: ${{ runner.temp }}/races-dry-run.json

      # Wikipedia's lists changed since the pinned (checked) versions: the
      # site keeps the checked ones until each change is checked
      - name: Alert on changed Wikipedia lists
        if: steps.races.outputs.wiki_changes != '' && steps.races.outputs.wiki_changes != '0' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANGED: ${{ steps.races.outputs.wiki_changed }}
        run: |
          gh issue create --label system-alert \
            --title "Races: Wikipedia's candidate lists changed for ${{ steps.races.outputs.wiki_changes }} seat(s)" \
            --body "Since the checked versions pinned in scripts/refresh/data/ballot.json: $CHANGED. The site still shows the checked lists. Proposed fix: check each change against the state's candidate list (it may be a real withdrawal, or vandalism), then move the pin to the new revision and re-run the races job. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # A seat held back (a campaign that filed the pre-general report isn't
      # on Wikipedia's list and hasn't been checked) is off the site until
      # scripts/refresh/data/ballot.json says why: tell the owner
      - name: Alert on seats held back
        if: steps.races.outputs.held != '' && steps.races.outputs.held != '0' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HELD: ${{ steps.races.outputs.held_seats }}
        run: |
          gh issue create --label system-alert \
            --title "Races: ${{ steps.races.outputs.held }} seat(s) held back from the ballot" \
            --body "A campaign that filed the FEC's pre-general report isn't on Wikipedia's list for these seats: $HELD. Proposed fix: check each against the state's candidate list and record why they're off the ballot (with a source) in scripts/refresh/data/ballot.json, then re-run the races job. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Candidates graded from the bulk files are still being double-checked:
      # start the record-by-record check for them (#55, races-check.yml)
      - name: Start the candidates' check
        if: steps.races.outputs.unchecked != '' && steps.races.outputs.unchecked != '0' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run races-check.yml -f dry_run=false

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_FAILED_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/health-alert.sh

      - name: Switch off after the last scheduled run
        if: always() && github.event_name == 'schedule' && github.event.schedule == '0 15 23,27 10 *'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%d)" -ge 27 ]; then gh workflow disable races.yml; fi
